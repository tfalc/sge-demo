spring:
  config:
    activate:
      on-profile: standalone
  flyway:
    enabled: false
  datasource:
    url: jdbc:h2:file:./data/sge;MODE=PostgreSQL;AUTO_SERVER=FALSE;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  sql:
    init:
      mode: never

app:
  spa:
    enabled: true
  cors:
    allowed-origin-patterns:
      - http://localhost:*
      - http://127.0.0.1:*

logging:
  level:
    org.springframework.security: INFO
