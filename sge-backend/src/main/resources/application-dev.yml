spring:
  config:
    activate:
      on-profile: dev
  flyway:
    enabled: false
  datasource:
    url: jdbc:h2:mem:sge;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    defer-datasource-initialization: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  sql:
    init:
      mode: always
      data-locations: classpath:dev-data.sql
  h2:
    console:
      enabled: true
      path: /h2-console
logging:
  level:
    org.springframework.security: DEBUG
