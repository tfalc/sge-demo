services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: sge
      POSTGRES_USER: sge
      POSTGRES_PASSWORD: sge123
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sge -d sge"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    profiles: ["infra"]

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    profiles: ["infra"]

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    profiles: ["infra"]

  backend:
    build:
      context: .
      dockerfile: sge-backend/Dockerfile
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/sge
      SPRING_DATASOURCE_USERNAME: sge
      SPRING_DATASOURCE_PASSWORD: sge123
      JWT_SECRET: demo-jwt-secret-minimum-32-characters-long
      SCHOOL_PACKAGE_ID: escola-demo
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    profiles: ["demo"]

  frontend:
    build:
      context: sge-frontend
      dockerfile: Dockerfile
      args:
        VITE_DEMO_BUILD: "true"
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
    profiles: ["demo"]

volumes:
  pgdata:
  miniodata:
