name: security

on:
  push:
    branches: [main, develop, "school/**"]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  dependency-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: OWASP Dependency-Check
        run: |
          mvn -f sge-backend/pom.xml -B org.owasp:dependency-check-maven:11.1.0:check \
            -DfailBuildOnCVSS=9 \
            -Dformats=HTML \
            -DsuppressionFile=sge-backend/dependency-check-suppressions.xml || true
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: sge-backend/target/dependency-check-report.html
          if-no-files-found: ignore
